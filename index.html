<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:site_name" content="Sentiful | Coming soon" />
    <meta property="og:title" content="Sentiful | Coming soon" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sentiful.net" />
    <meta property="og:description" content="We're launching our website soon. You'll be taken care of with cool features for users and insightful content for developers">

    <meta property="og:image" content="https://sentiful.net/duck.jpeg" />
    <meta property="og:video" content="https://sentiful.net/senti.mp4" />
    <meta property="og:video:secure_url" content="https://prim.sentiful.net/senti.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />

    <meta name="description" content="We're launching our website soon, you'll be taken care of with cool features for users and insightful content for developers">
    <meta name="theme-color" content="#FAA000" />
    <title>Sentiful | Coming soon</title>
    <style>
        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: grid;
            place-items: center;
            height: 100vh;
            background: black;
            color: #fda000;
            text-align: center;
        }

        .movers {
            background: #fda000;
            position: fixed;
            left: -100px;
            top: -100px;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 9999;
            border-radius: 100%;
            pointer-events: none;
        }

        .hidden {
            display: none;
        }

        #trail-item {
            content: '';
            background: #fda000;
            display: block;
            width: 50px;
            height: 50px;
            border-radius: 5px;
        }

        #trail-item:hover {
            background: #f37000;
        }

        #trails:checked + #trail-item {
            background: #ff3333;
        }

        .cen {
            display: flex;
            justify-content: center;
        }

        .slider {
            position: relative;
            width: 25vw;
            background: #fda000;
            height: 20px;
            border-radius: 100vw;
            --val: 10;
        }

        .slider-thumb {
            position: absolute;
            width: 40px;
            border-radius: 5px;
            height: 30px;
            background: #f37000;
            top: 50%;
            transform: translateX(-50%) translateY(-50%);
            left: calc(var(--val) * 1%);
        }

        @media (max-width: 900px) {
            .slider {
                width: 80vw;
            }
        }

        .top-space {
            margin-top: 2em;
        }

        #title {
            transition: transform 0.15s ease;
            display: inline-block;
        }

        .confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            animation: confetti-burst 0.7s ease-out forwards;
        }

        @keyframes confetti-burst {
            to {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot));
                opacity: 0;
            }
        }

        #runaway-btn {
            position: fixed;
            left: 50%;
            top: 62%;
            transform: translate(-50%, -50%);
            background: #fda000;
            color: black;
            border: none;
            padding: 10px 18px;
            border-radius: 100vw;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            z-index: 50;
            transition: left 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #taunt {
            position: fixed;
            left: 50%;
            top: 10vh;
            transform: translateX(-50%) scale(0);
            transform-origin: center;
            pointer-events: none;
            z-index: 60;
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            opacity: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        #taunt.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .invaded-duck {
            position: fixed;
            pointer-events: none;
            z-index: 5;
        }

        .invaded-duck .duck-inner {
            width: 100%;
            opacity: .5;
            height: 100%;
            background-image: url('duck.jpeg');
            background-size: cover;
            background-position: center;
            animation: duck-spin 3s linear infinite;
        }

        .invaded-duck .duck-inner.inverted {
            animation-name: duck-spin-mirror;
            filter: invert(1);
        }

        @keyframes duck-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes duck-spin-mirror {
            from { transform: rotate(0deg) scaleX(-1); }
            to { transform: rotate(360deg) scaleX(-1); }
        }

        .fall-duck {
            position: fixed;
            background-image: url('duck.jpeg');
            background-size: cover;
            background-position: center;
            pointer-events: none;
            z-index: 5;
        }

        .fall-duck {
            top: -60px;
            width: 40px;
            height: 40px;
            animation: fall-duck 3s ease-in forwards;
        }

        @keyframes fall-duck {
            to {
                transform: translateY(120vh) rotate(720deg);
            }
        }
    </style>
  </head>
  <body>
    <div class="all">
        <h1 id="title">Work In Progress</h1>
        <div class="cen">
            <input id="trails" checked class="hidden" type="checkbox">
            <label id="trail-item" for="trails"></label>
        </div>
        <div class="cen top-space">
            <div id="prim-slider" class="slider">
                <div class="slider-track"></div>
                <div class="slider-thumb"></div>
            </div>
        </div>
        <button id="runaway-btn">Catch me!</button>
        <div id="taunt"></div>
        <h3 id="click_test" class="movers"></h3>
        <div class="mover-holder">

        </div>
    </div>
    <script>

        const DUCK_AMOUNT = 69;

        const sliderMinValue = 10;
        const sliderMaxValue = 500;
        const defaultSliderValue = 150;
        let sliderValue = defaultSliderValue;

        let diff = (sliderMaxValue - sliderMinValue);
        function getVal() {
            return ((sliderValue - sliderMinValue) / diff) * 100
        }

        const slider = document.getElementById('prim-slider');
        slider.controllingSlider = false;
        slider.style.setProperty('--val', getVal());

        const sliderThumb = slider.querySelector('.slider-thumb');
        sliderThumb.addEventListener('pointerdown', e => {
            slider.controllingSlider = true;
        })

        document.addEventListener('pointerup', e => {
            slider.controllingSlider = false;
        })


        const mover = document.getElementById('click_test');
        const moverHistory = [];
        let his = false;

        let m = {x: null, y: null}
        setInterval(() => {
            if (m.x === null || m.y === null) {
                return;
            }

            mover.style.left = `${m.x}px`;
            mover.style.top = `${m.y - 25}px`;

            if (his) {
                const el = document.createElement('h3');
                el.classList.add('movers');
                el.style.left = `${m.x}px`;
                el.style.top = `${m.y - 25}px`;
                document.getElementsByClassName('mover-holder')[0].appendChild(el);
                moverHistory.unshift(el);
            }

            if (moverHistory.length > sliderValue) {
                let remEl = moverHistory.pop();
                if (remEl) remEl.remove();

                remEl = moverHistory.pop();
                if (remEl) remEl.remove();
            }
        })

        document.addEventListener('mousemove', e => {
            if (slider.controllingSlider) {
                const bound = slider.getBoundingClientRect();
                const x = e.clientX - bound.left;
                sliderValue = Math.min(sliderMaxValue, Math.max(sliderMinValue, Math.floor((x / bound.width) * diff) + sliderMinValue));
                slider.style.setProperty('--val', getVal());
                return;
            }

            m.x = e.clientX;
            m.y = e.clientY;
        });

        document.addEventListener('touchmove', e => {
            if (slider.controllingSlider) {
                const bound = slider.getBoundingClientRect();
                const x = e.touches[0].clientX - bound.left;
                sliderValue = Math.min(sliderMaxValue, Math.max(sliderMinValue, Math.floor((x / bound.width) * diff) + sliderMinValue));
                slider.style.setProperty('--val', getVal());
                return;
            }

            m.x = e.touches[0].clientX;
            m.y = e.touches[0].clientY;
        });

        const trailInput = document.getElementById('trails');
        his = trailInput.checked;
        trailInput.addEventListener('change', e => {
            his = trailInput.checked;
            if (!his) {
                for (let i = moverHistory.length - 1; i >= 0; i--) {
                    moverHistory[i].remove();
                    moverHistory.pop();
                }
            }
        })

        const title = document.getElementById('title');

        function burst(x, y, n = 14) {
            for (let i = 0; i < n; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                const ang = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 90;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                el.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
                el.style.setProperty('--dy', `${Math.sin(ang) * dist}px`);
                el.style.setProperty('--rot', `${(Math.random() * 720) - 360}deg`);
                el.style.background = Math.random() > 0.5 ? '#fda000' : '#f37000';
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            }
        }

        document.addEventListener('click', e => {
            if (e.target === runawayBtn) return;
            burst(e.clientX, e.clientY, 10);
        });

        const runawayBtn = document.getElementById('runaway-btn');
        const tauntEl = document.getElementById('taunt');
        let runawayClicks = 0;
        let tauntTimeout;
        const taunts = [
            'Nope!', 'So close!', 'Too slow!', 'Catch me!', 'Almost!',
            'Persistent, huh?', 'Keep going!', 'Just give up!', 'You got me? No.', 'Wow, dedicated.'
        ];

        function relocateBtn() {
            const r = runawayBtn.getBoundingClientRect();
            const nx = r.width / 2 + Math.random() * (innerWidth - r.width);
            const ny = r.height / 2 + Math.random() * (innerHeight - r.height);
            runawayBtn.style.left = `${nx}px`;
            runawayBtn.style.top = `${ny}px`;
        }

        function showTaunt(text) {
            tauntEl.textContent = text;
            tauntEl.classList.add('show');
            clearTimeout(tauntTimeout);
            tauntTimeout = setTimeout(() => tauntEl.classList.remove('show'), 1400);
        }

        runawayBtn.addEventListener('click', e => {
            runawayClicks++;
            showTaunt(`#${runawayClicks} ${taunts[runawayClicks % taunts.length]}`);
            const r = runawayBtn.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, 22);
            relocateBtn();
        });

        document.addEventListener('pointermove', e => {
            if (slider.controllingSlider) return;
            const r = runawayBtn.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;
            if (Math.hypot(e.clientX - cx, e.clientY - cy) < 80) {
                relocateBtn();
            }

            const rx = ((e.clientY - innerHeight / 2) / innerHeight) * -8;
            const ry = ((e.clientX - innerWidth / 2) / innerWidth) * 8;
            title.style.transform = `perspective(500px) rotateX(${rx}deg) rotateY(${ry}deg)`;
        });

        let lastActivity = Date.now();
        let invading = false;
        let idleTimer = null;
        let idleDucks = [];

        const activityEvents = ['pointermove', 'pointerdown', 'keydown', 'touchmove', 'wheel', 'scroll'];
        activityEvents.forEach(ev => window.addEventListener(ev, () => {
            lastActivity = Date.now();
            if (invading) clearIdleDucks();
        }));

        function stepIdleDucks() {
            idleDucks.forEach(d => {
                d.vx += (Math.random() - 0.5) * 0.08;
                d.vy += (Math.random() - 0.5) * 0.08;
                const sp = Math.hypot(d.vx, d.vy);
                if (sp > 3) { d.vx = (d.vx / sp) * 3; d.vy = (d.vy / sp) * 3; }
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 0) { d.x = 0; d.vx = Math.abs(d.vx); }
                if (d.x > innerWidth - d.size) { d.x = innerWidth - d.size; d.vx = -Math.abs(d.vx); }
                if (d.y < 0) { d.y = 0; d.vy = Math.abs(d.vy); }
                if (d.y > innerHeight - d.size) { d.y = innerHeight - d.size; d.vy = -Math.abs(d.vy); }
                d.el.style.left = `${d.x}px`;
                d.el.style.top = `${d.y}px`;
            });
        }

        function clearIdleDucks() {
            clearInterval(idleTimer);
            idleTimer = null;
            idleDucks.forEach(d => d.el.remove());
            idleDucks = [];
            invading = false;
            showTaunt('Duck invasion repelled!');
        }

        function spawnIdleDucks() {
            if (invading) return;
            invading = true;
            for (let i = 0; i < DUCK_AMOUNT; i++) {
                const el = document.createElement('div');
                el.className = 'invaded-duck';
                const size = 36 + Math.random() * 20;
                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                el.style.left = `${Math.random() * innerWidth}px`;
                el.style.top = `${Math.random() * innerHeight}px`;
                const inner = document.createElement('div');
                inner.className = 'duck-inner' + (i % 2 === 0 ? ' inverted' : '');
                inner.style.animationDuration = `${1.5 + Math.random() * 7}s`;
                inner.style.animationDelay = `${-Math.random() * 12}s`;
                inner.style.animationDirection = Math.random() < 0.5 ? 'normal' : 'reverse';
                el.appendChild(inner);
                idleDucks.push({
                    el,
                    x: parseFloat(el.style.left),
                    y: parseFloat(el.style.top),
                    size,
                    vx: (Math.random() - 0.5) * 3,
                    vy: (Math.random() - 0.5) * 3,
                });
                document.body.appendChild(el);
            }
            idleTimer = setInterval(stepIdleDucks, 16);
            showTaunt('They came...');
        }

        setInterval(() => {
            if (!invading && Date.now() - lastActivity > 3000) spawnIdleDucks();
        }, 1000);

        const secretWord = 'sentiful';
        let typedChars = '';
        document.addEventListener('keydown', e => {
            typedChars = (typedChars + e.key.toLowerCase());
            if (typedChars.length > secretWord.length) typedChars = typedChars.slice(-secretWord.length);
            if (typedChars === secretWord) triggerSecret();
        });

        function triggerSecret() {
            title.textContent = 'You found the secret!';
            document.body.style.filter = 'invert(1) hue-rotate(180deg)';
            showTaunt('Secret unlocked!');
            burst(innerWidth / 2, innerHeight / 2, 40);
            for (let i = 0; i < 18; i++) {
                const el = document.createElement('div');
                el.className = 'fall-duck';
                const size = 30 + Math.random() * 26;
                el.style.width = `${size}px`;
                el.style.height = `${size}px`;
                el.style.left = `${Math.random() * innerWidth}px`;
                el.style.animationDuration = `${2 + Math.random() * 2}s`;
                el.style.animationDelay = `${Math.random() * 1.2}s`;
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
            }
            setTimeout(() => {
                title.textContent = 'Work In Progress';
                document.body.style.filter = '';
            }, 4500);
        }
   </script>
  </body>
</html>
